name: Build (Windows)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: |
          cd build
          echo "=== run tst_document ==="
          ./tst_document.exe
          echo "=== end (exit $?) ==="

      - name: Package runtime (smoke)
        shell: bash
        run: |
          windeployqt --release --dir deploy build/CompositorQt.exe
          ls deploy | head -20
