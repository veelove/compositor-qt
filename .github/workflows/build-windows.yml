name: Build (Windows)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: |
          set +e  # 任何一步失败都继续,最后整体检查 tst_document 的退出码
          cd build
          # tst_document 需要 Qt DLL,测试前先部署
          echo "=== windeployqt ==="
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw tst_document.exe
          echo "windeployqt exit=$?"
          # windeployqt 默认只装 windows 平台插件;offscreen 需手动复制
          echo "=== add offscreen platform ==="
          mkdir -p platforms
          cp "$QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" platforms/ 2>/dev/null && echo "qoffscreen copied" || echo "no qoffscreen"
          ls platforms/ | head
          # Windows headless CI:必须用 offscreen 平台插件,否则 GUI subsystem 启动失败
          # QTest 不接受 Qt 平台 CLI 参数,只能通过环境变量
          echo "=== run tst_document (offscreen) ==="
          QT_QPA_PLATFORM=offscreen ./tst_document.exe
          TEST_EXIT=$?
          echo "=== end (exit $TEST_EXIT) ==="
          exit $TEST_EXIT

      - name: Package runtime
        shell: bash
        run: |
          mkdir -p deploy
          # 先把主程序 exe 和测试用 exe 都拷到 deploy/(windeployqt 不会自动复制 exe)
          cp build/CompositorQt.exe deploy/ 2>&1
          ls -la build/CompositorQt.exe
          # 用 windeployqt 收集运行所需的 Qt DLL / 平台插件 / QML / translations
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --dir deploy --no-system-d3d-compiler --no-opengl-sw deploy/CompositorQt.exe
          WDEPLOYQT_EXIT=$?
          echo "windeployqt exit=$WDEPLOYQT_EXIT"
          # vision_tool.py 与 exe 同目录,VisionProvider::detectScript 才能找到
          cp tools/vision_tool.py deploy/
          # 列出 deploy 里所有顶层条目确认 exe 在
          echo "=== deploy contents ==="
          ls -la deploy/ | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompositorQt-windows-x64
          path: deploy
          if-no-files-found: error
          retention-days: 14
